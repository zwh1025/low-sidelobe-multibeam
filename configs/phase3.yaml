# Phase 3: dual-beam network minimal validation
array: {n: 64, d_over_lambda: 0.5, n_pad: 512}
taylor: {sll_db: -25, nbar: 5}
data:
  m: 2
  n_train: 4000
  n_val: 500
  n_test: 500
  theta_min_deg: 2
  theta_max_deg: 45
  min_sep_deg: 5
  swap_augment: true
  with_amp_channel: true
loss:
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  gamma2: 50.0
  delta: 0.05
  use_pat: true
  sll_domain: dB          # 路线②: dB 域 LSE（下降快），配铰链束下限防退化
  tau_start: 1.0          # dB 域退火 1.0 -> 0.1
  tau_end: 0.1
  l_beam_mode: hinge      # 路线②: 铰链式硬束下限
  beam_floor: 0.95        # 路线②再收紧: 20log10(1/0.95)=0.446 dB, 目标 cons<=1
  stage1_frac: 0.0
  warmup_frac: 0.0
  r_train: 0.040
train:
  batch: 32
  epochs: 150
  lr: 0.001
  weight_decay: 0.0001
  patience: 40
  clip: 1.0
  width: 1.0
seed: 42
